apiVersion: apps/v1
kind: Deployment
metadata:
  name: readapi
  namespace: miniexchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readapi
  template:
    metadata:
      labels:
        app: readapi
    spec:
      containers:
        - name: readapi
          image: miniexchange-readapi:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: Grpc__OrderQueryAddress
              value: "http://consumer:5000"

            - name: OpenTelemetry__OtlpEndpoint
              valueFrom:
                configMapKeyRef:
                  name: miniexchange-config
                  key: OpenTelemetry__OtlpEndpoint

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: readapi
  namespace: miniexchange
spec:
  selector:
    app: readapi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort