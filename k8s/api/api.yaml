apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: miniexchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: miniexchange-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=miniexchange;Username=miniexchange;Password=miniexchange"

            - name: ConnectionStrings__Redis
              value: "redis:6379"

            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: miniexchange-config
                  key: Kafka__BootstrapServers

            - name: OpenTelemetry__OtlpEndpoint
              valueFrom:
                configMapKeyRef:
                  name: miniexchange-config
                  key: OpenTelemetry__OtlpEndpoint

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: miniexchange
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort