services:

  postgres:
    image: postgres:18
    container_name: miniexchange-postgres
    environment:
      POSTGRES_DB: miniexchange
      POSTGRES_USER: miniexchange
      POSTGRES_PASSWORD: miniexchange
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U miniexchange -d miniexchange"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - miniexchange

  postgres-consumer:
    image: postgres:18
    container_name: miniexchange-postgres-consumer
    environment:
      POSTGRES_DB: miniexchange_consumer
      POSTGRES_USER: miniexchange_consumer
      POSTGRES_PASSWORD: miniexchange_consumer
    ports:
      - "5434:5432"
    volumes:
      - postgres-consumer-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U miniexchange_consumer -d miniexchange_consumer"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - miniexchange

  redis:
    image: redis:8.2
    container_name: miniexchange-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - miniexchange

  kafka:
    image: apache/kafka:4.0.0
    container_name: miniexchange-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - miniexchange

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: miniexchange-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - miniexchange

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: miniexchange-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - miniexchange

  grafana:
    image: grafana/grafana:13.2.1
    container_name: miniexchange-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - miniexchange

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: miniexchange-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=miniexchange;
        Username=miniexchange;
        Password=miniexchange

      ConnectionStrings__Redis: redis:6379

      Kafka__BootstrapServers: kafka:19092
      Kafka__OrdersTopic: orders
      Kafka__OutboxBatchSize: 100
      Kafka__OutboxPollIntervalMs: 1000
      OpenTelemetry__OtlpEndpoint: http://jaeger:4318/v1/traces

    ports:
      - "5081:8080"

    networks:
      - miniexchange

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: miniexchange-consumer
    depends_on:
      postgres-consumer:
        condition: service_healthy
      kafka:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=postgres-consumer;
        Port=5432;
        Database=miniexchange_consumer;
        Username=miniexchange_consumer;
        Password=miniexchange_consumer

      Kafka__BootstrapServers: kafka:19092
      Kafka__GroupId: orders-consumer
      Kafka__Topic: orders
      Kafka__DeadLetterTopic: orders.dlq
      OpenTelemetry__OtlpEndpoint: http://jaeger:4318/v1/traces

    ports:
      - "5000:5000"
      - "5001:5001"

    networks:
      - miniexchange

  readapi:
    build:
      context: .
      dockerfile: Dockerfile.readapi
    container_name: miniexchange-readapi
    depends_on:
      consumer:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080

      Grpc__OrderQueryAddress: http://consumer:5000
      OpenTelemetry__OtlpEndpoint: http://jaeger:4318/v1/traces

    ports:
      - "5080:8080"
      
    networks:
      - miniexchange

volumes:
  postgres-data:
  postgres-consumer-data:
  redis-data:
  kafka-data:

networks:
  miniexchange: